  - contentinfo [ref=e6037]:
    - heading "How this list is built" [level=2] [ref=e6038]
    - list [ref=e6039]:
      - listitem [ref=e6040]:
        - strong [ref=e6041]: "Companies:"
        - text: a hand-vetted list; each employer must clear ₹20L base pay generally and ₹50L base at senior level in India. Company bands are recorded with sources in the repo and refined by pay data observed in real postings.
      - listitem [ref=e6042]:
        - strong [ref=e6043]: "Roles:"
        - text: senior+ engineering titles only (Senior / Staff / Principal / Lead / Architect / Director / EM / VP). Where pay is published, the band's
        - emphasis [ref=e6044]: lower bound
        - text: must clear ₹50L base; equity and bonus never count. Where pay is not published, the company's vetted senior band applies.
      - listitem [ref=e6045]:
        - strong [ref=e6046]: "Geography:"
        - text: India-located, remote-India, and unrestricted-remote roles (the latter flagged "verify eligibility"). Roles restricted to other regions are excluded.
      - listitem [ref=e6047]:
        - strong [ref=e6048]: "Freshness:"
        - text: crawled daily from public ATS boards. A role leaves the active list after two consecutive successful crawls without it, and lives on in the archive. Failed crawls never remove anything.
