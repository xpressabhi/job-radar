<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_TITLE}}</title>
<meta name="description" content="{{SITE_DESCRIPTION}}">
<style>
{{STYLE}}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <h1>{{SITE_NAME}}</h1>
  <p class="tagline">{{SITE_TAGLINE}}</p>
  <div class="coverage">{{COVERAGE}}</div>
</header>

<div class="filters" id="filters" hidden>
  <label>Category<select id="f-category" data-filter="category"><option value="">All</option>{{CATEGORY_OPTIONS}}</select></label>
  <label>City<select id="f-city" data-filter="city"><option value="">Any</option></select></label>
  <label>Work mode<select id="f-mode" data-filter="mode"><option value="">Any</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">On-site</option></select></label>
  <label>Company<select id="f-company" data-filter="company"><option value="">Any</option></select></label>
  <label>Freshness<select id="f-recency" data-filter="recency"><option value="">Any time</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label>
  <label>Search<input id="f-search" type="search" placeholder="title, company, tag…" autocomplete="off"></label>
  <label>&nbsp;<button id="f-clear" type="button">Reset filters</button></label>
</div>
<p class="presets"><span>Quick filters:</span>
  <button data-preset="ai-ml">AI / agentic</button>
  <button data-preset="backend">Backend</button>
  <button data-preset="frontend">Frontend</button>
  <button data-preset="platform-infra">Platform / infra</button>
</p>
<p class="count" id="count" hidden></p>

<ul class="jobs" id="jobs">
{{ROWS}}
</ul>

<footer class="site">
  <h2>How this list is built</h2>
  <ul>
    {{ABOUT_ITEMS}}
  </ul>
  <p class="feeds">Data: <a href="jobs.json">jobs.json</a> · <a href="feed.xml">RSS feed</a> · <a href="archive.html">Archive ({{ARCHIVE_COUNT}} closed)</a></p>
  <p>Last updated {{UPDATED}}. {{SOURCE_NOTE}}</p>
</footer>
</div>
<script>
{{SCRIPT}}
</script>
</body>
</html>
