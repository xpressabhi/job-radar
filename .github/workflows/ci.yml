name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test
      - name: Validate config
        run: npm run validate:config
      - name: Replay against golden store
        run: npm run replay
      - name: Validate company universe
        run: npm run validate:companies
