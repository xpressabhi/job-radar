name: crawl

on:
  schedule:
    # 01:30 UTC = 07:00 IST intended. GitHub can dispatch scheduled runs hours
    # late under load — observed ~06:55–07:35 UTC starts, so don't rely on punctuality.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and render only — never commit or deploy"
        type: boolean
        default: false
      company:
        description: "Limit the crawl to one company (name or slug)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional LLM fallback for ambiguous titles. Without the secret the crawler is
          # rules-only and quietly queues those titles for a later run.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE_URL: ${{ vars.LLM_API_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.company }}" ]; then ARGS="$ARGS --company ${{ inputs.company }}"; fi
          node scripts/crawl.mjs $ARGS

      - name: Render site
        run: node scripts/render.mjs

      - name: Commit data changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            MSG=$(node -e "const s=require('./data/jobs.json');const r=s.lastRun||{};console.log('crawl: '+new Date().toISOString().slice(0,10)+' — +'+(r.new||0)+' new, '+(r.archived||0)+' archived, '+(r.seen||0)+' seen, '+(r.boardsOk||0)+'/'+(r.boardsTotal||0)+' boards ok')")
            git commit -m "$MSG"
            git push
          fi

      - name: Board health issues
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/health-issues.mjs

      - name: Configure Pages
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: ${{ inputs.dry_run != true }}
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report crawl failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create crawl-failure --force --color b60205 \
            --description "Nightly crawl failed; closes automatically on recovery" >/dev/null
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label crawl-failure --state open --limit 1 --json number --jq '.[0].number')
          BODY="The crawl workflow failed.
          Run: $RUN_URL"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label crawl-failure \
              --title "[crawl-failure] workflow failed — check run logs" --body "$BODY"
          fi

      - name: Clear crawl-failure issue
        if: success() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label crawl-failure --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Crawl recovered — closing automatically."
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY"
          fi
